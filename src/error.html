<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b1f33" />
		<meta name="robots" content="noindex" />
		<title>Fehler · Bodensee Guide</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 2rem 1.5rem;
				background: #0b1f33;
				color: #f3f8fb;
				line-height: 1.55;
			}
			main {
				width: 100%;
				max-width: 30rem;
				text-align: center;
			}
			.mark {
				font-size: 3rem;
				line-height: 1;
			}
			.code {
				margin-top: 1.5rem;
				color: #7fd3ea;
				font-size: 0.9rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}
			h1 {
				margin: 0.5rem 0 1rem;
				font-size: 2rem;
				line-height: 1.15;
			}
			p {
				margin: 0;
				color: #cfdde6;
			}
			.actions {
				display: grid;
				gap: 0.75rem;
				margin-top: 2rem;
			}
			a {
				display: block;
				padding: 0.9rem 1.25rem;
				border-radius: 0.75rem;
				background: #7fd3ea;
				color: #062330;
				font-size: 1.05rem;
				font-weight: 700;
				text-decoration: none;
			}
			small {
				display: block;
				margin-top: 2rem;
				color: #8fa6b6;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="mark" aria-hidden="true">🧭</div>
			<p class="code">Fehler %sveltekit.status%</p>
			<h1>Da ist etwas schiefgelaufen.</h1>
			<p>Die App konnte diese Seite nicht laden. Zur Karte geht es immer weiter.</p>
			<div class="actions">
				<a href="/">Zur Karte</a>
			</div>
			<small>%sveltekit.message%</small>
		</main>
	</body>
</html>
