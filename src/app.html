<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<!-- Pinch-zoom stays enabled: many readers need to enlarge the map or the text. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b1f33" />
		<script>
			// Apply the saved text size before the first paint to avoid a flash of small text.
			try {
				if (localStorage.getItem('text-size') === 'large') {
					document.documentElement.classList.add('text-large');
				}
			} catch {}
		</script>
		<!--
			The manifest link is written here by hand: vite-plugin-pwa injects its own into an
			index.html that Vite processes, but SvelteKit renders this template itself, so without
			this line the install prompt never becomes available.
		-->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Bodensee" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Shared links open with a proper card: the harbour photo needs a raster image, the SVG logo would not work. -->
		<meta property="og:title" content="Bodensee Guide" />
		<meta
			property="og:description"
			content="Kurzurlaub und Ausflüge rund um den Bodensee: Natur, Kultur, Kulinarik und Aussichten mit Karte, Tourplaner und Merkliste."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://reisetipps-sv.vercel.app/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Der Lindauer Hafen mit Leuchtturm und Bavaria am Bodensee (© Dietmar Rabich, CC BY-SA 4.0)"
		/>
		<meta property="og:locale" content="de_DE" />
		<meta property="og:locale:alternate" content="en_US" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
